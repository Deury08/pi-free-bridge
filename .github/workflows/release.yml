name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build pi-free-bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="pi-free-bridge${{ matrix.ext }}"
          cd bridge-go
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o "$out" ./cmd/bridge-go
          cd ..
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "pi-free-bridge_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "bridge-go/pi-free-bridge${{ matrix.ext }}"
          else
            tar -czf "pi-free-bridge_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" -C bridge-go "pi-free-bridge${{ matrix.ext }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-free-bridge_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            pi-free-bridge_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            pi-free-bridge_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
